<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Exam Forensics{% endblock %}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
{% if session.user %}<header><b>Answer Sheet Forensics</b><nav><a href="{{ url_for('home') }}">Upload and history</a><span class="muted">{{ session.user }}</span><a href="{{ url_for('logout') }}">Log out</a></nav></header>{% endif %}
<main>{% for m in get_flashed_messages() %}<div class="flash" role="alert">{{ m }}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
